[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stayops-ai"
version = "0.1.0"
description = "A human-supervised AI guest support platform for short-term rental operators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-openrouter>=0.1,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "structlog>=24,<26",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
documents = [
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
]
dev = [
  "aiosqlite>=0.20,<1",
  "faker>=33,<40",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "testcontainers[postgres]>=4.9,<5",
]

[project.scripts]
stayops-build-policy-index = "app.cli.build_policy_embeddings:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build]
exclude = [
  "/evals",
  "/scripts",
  "/tests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires an external service such as PostgreSQL",
]
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
